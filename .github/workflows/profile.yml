name: Refresh engineering dashboard
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_contributions.py'
      - 'scripts/render_heatmap_svg.py'
      - 'scripts/generate_skyline.py'
      - 'scripts/generate_dashboard.py'
      - 'scripts/visual_theme.py'
      - 'data/dashboard.json'
      - 'data/tech-icons.json'
      - '.github/workflows/profile.yml'
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Subhajit2407/Subhajit2407'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch public calendar without a personal token
        run: python3 scripts/fetch_contributions.py
      - name: Render animated contribution heatmap
        run: python3 scripts/render_heatmap_svg.py
      - name: Generate dashboard panels and contribution skyline
        run: |
          python3 scripts/generate_dashboard.py
          python3 scripts/generate_skyline.py
      - name: Commit refreshed public data and SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/contributions.json contrib-heatmap.svg assets/*.svg assets/projects/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh animated contribution calendar [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
