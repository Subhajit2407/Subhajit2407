name: Refresh profile visuals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_stats.py'
      - '.github/workflows/profile.yml'
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Subhajit2407/Subhajit2407'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate cards from GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_stats.py
      - name: Commit updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/*.svg profile-3d-contrib/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh GitHub profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
